document.addEventListener('submit',submit=>{const form=submit.target;submit.preventDefault();const data=new FormData(form);if(form.id==='rules-form'){state.rules={advance:Number(data.get('advance')),overdue:Number(data.get('overdue')),channel:data.get('channel'),review:data.get('review')==='on'};persist();render();toast('规则已保存，健康分布与提醒同步重算')}else if(form.id==='material-form'){const campaign=state.campaigns.find(entry=>entry.id===data.get('campaign'));if(data.get('expires')<campaign.start){toast('到期日期不能早于活动开始日期');return}const store=data.get('binding')==='store'?STORES.find(entry=>entry.id===data.get('store')):null,index=state.items.length,item={id:`MAT-${state.today.replaceAll('-','').slice(2,6)}-${String(index+1).padStart(4,'0')}`,name:data.get('name').trim(),type:data.get('type'),campaign:campaign.id,store:store?.id||'',region:store?.region||data.get('region'),binding:data.get('binding'),expires:data.get('expires'),status:'pending',index,proof:'',destroyProof:'',events:[]};if(!item.name){toast('请输入有效物料名称');return}while(state.items.some(entry=>entry.id===item.id))item.id+='N';log(item,'总部创建物料 · '+(item.binding==='region'?'绑定区域池':'绑定门店'));state.items.push(item);persist();page='materials';close();detail(item.id,'qr');toast('创建成功，可切到店长端模拟签收')}else if(form.id==='campaign-form'){if(data.get('end')<data.get('start')){toast('结束日期不能早于开始日期');return}const name=data.get('name').trim(),theme=data.get('theme').trim();if(!name||!theme){toast('活动名称与主题不能为空');return}state.campaigns.push({id:'ACT-'+Date.now(),name,headline:theme,start:data.get('start'),end:data.get('end'),season:'NEW CAMPAIGN',color:''});persist();close();navigate('campaigns');toast('活动创建成功，可继续新建关联物料')}else if(form.id==='reject-form'){const item=itemOf(form.dataset.id),reason=data.get('reason').trim();if(!reason){toast('请填写整改要求');return}item.status='issue';item.issueReason=reason;log(item,'总部下发整改 · '+reason);persist();render();detail(item.id,'proof');toast('整改已记录，店长端可查看并重新提交')}});

t-size="9">入口右侧</text>'}<rect x="15" y="16" width="32" height="58" fill="#d9e1cf"/><path d="m17 56 21-20M17 45l16-18" stroke="#b5c7a2" stroke-width="2"/><rect x="20" y="72" width="23" height="25" fill="#b7aa8b"/></svg>`}

function overview(){const metrics=stats(),total=metrics.open.length||1,green=metrics.healthy.length/total*100,orange=green+metrics.expiring.length/total*100,red=orange+(metrics.expired.length+metrics.issue.length)/total*100;return`${heading('BRAND EXPERIENCE / OVERVIEW','总部总览','早上好，陈经理。每一份到店物料，都值得被认真管理。','<button class="btn" data-action="guide">'+icon('play')+'演示导览</button><button class="btn primary" data-action="phone">'+icon('scan')+'演示扫码签收</button>')}<section class="hero"><div><h2>从到店到退场，品牌体验始终在线。</h2><p>一码连接物料、活动与门店。签收有记录，摆放有标准，到期有提醒，总部看得见。</p><div class="hero-tags">${['一码一物','标准化摆放','到期闭环'].map(text=>`<span>${icon('check')}${text}</span>`).join('')}<button class="btn text" data-action="nav" data-page="materials">查看全部物料 →</button></div></div><div class="hero-art">${scene()}<div class="float first">${icon('scan')}扫码签收 · 身份绑定</div><div class="float second">${icon('shield')}到期提醒 · 闭环管理</div></div></section><div class="kpis">${kpi('门店物料健康率',metrics.rate,'%',`${metrics.healthy.length} / ${metrics.open.length} 份未归档物料健康在用`,'green','shield')}${kpi('纳管物料总数',state.items.length,'份',`覆盖 ${new Set(state.items.map(item=>item.store).filter(Boolean)).size} 家门店 · ${state.campaigns.length} 场活动`,'','box')}${kpi('即将到期',metrics.expiring.length,'份',`未来 ${state.rules.advance} 天内到期，提前安排撤换`,'','clock')}${kpi('到期未闭环',metrics.expired.length,'份',metrics.expired.length?'待撤下 / 销毁审核，需优先跟进':'当前无逾期物料，体验保持新鲜',metrics.expired.length?'red':'green','warning')}</div><div class="overview-grid"><section class="panel"><div class="panel-head"><div><h2>物料健康分布</h2><p>未归档物料 · 按当前业务日实时计算</p></div><span class="badge gray">${metrics.open.length} 份</span></div><div class="panel-body health-layout"><div class="donut" style="background:conic-gradient(var(--green) 0 ${green}%,#e1af62 ${green}% ${orange}%,#d07b68 ${orange}% ${red}%,#dde5d8 ${red}% 100%)" role="img" aria-label="健康在用率 ${metrics.rate}%"><div class="donut-value">${metrics.rate}%<small>健康在用率</small></div></div><div class="legend">${[['健康在用',metrics.healthy.length,''],['即将到期',metrics.expiring.length,'orange'],['到期 / 待整改',metrics.expired.length+metrics.issue.length,'red'],['待签收 / 安装 / 审核',metrics.pending.length,'gray']].map(([label,value,color])=>`<div class="legend-row"><span class="dot ${color}"></span><span>${label}</span><strong>${value} <span class="muted" style="font-size:10px;font-weight:400">份</span></strong></div>`).join('')}</div></div><div class="panel-foot">${icon('info')}健康 = 审核通过、无整改、剩余有效期大于 ${state.rules.advance} 天；已销毁不计入分母。</div></section><section class="panel"><div class="panel-head"><div><h2>今日待办</h2><p>把问题处理在顾客看到之前</p></div><button class="btn text" data-action="nav" data-page="reminders">全部 →</button></div><div class="tasks">${[['trash','red',`${metrics.expired.length} 份物料已到期，需要退场`,'店长提交销毁凭证，总部审核后归档','nav','去处理'],['clock','',`${metrics.expiring.length} 份物料将在 ${state.rules.advance} 天内到期`,'提前提醒店长安排撤换，避免过期展示','nav','查看提醒'],['photo','green',`${metrics.review.length} 份凭证待总部审核`,'线上核对摆放位置与销毁结果','reviewList','去审核']].map(([symbol,color,title,text,action,label])=>`<div class="task"><div class="task-icon ${color}">${icon(symbol)}</div><div class="task-main"><strong>${title}</strong><p>${text}</p></div><button class="task-link" data-action="${action}" data-page="reminders">${label} →</button></div>`).join('')}</div></section></div><section class="panel"><div class="panel-head"><div><h2>重点关注物料</h2><p>优先展示到期、整改与待处理项</p></div><button class="btn text" data-action="nav" data-page="materials">全部台账 →</button></div>${table([...metrics.open].sort((first,second)=>priority(first)-priority(second)).slice(0,5))}<div class="caption"><span>签收、摆放、销毁凭证均可追溯</span><button class="btn text" data-action="phone">体验店长工作流 →</button></div></section>`}

function phone(id){phoneId=id||(state.items.find(item=>item.status==='pending'&&days(item)>=0)||state.items[0]).id;phoneStep=id?'identified':'scan';photo='';sample=false;renderPhone()}
function renderPhone(){const item=itemOf(phoneId);if(!item)return;const store=storeOf(item),expired=days(item)<0,banner='<div class="demo">店长端演示 · 模拟扫码 / 提交</div>';let body='';if(phoneStep==='scan'){body=`${banner}<div class="eyebrow">MATERIAL CHECK-IN</div><h2>物料到了？扫一扫。</h2><p>签收、查看摆放标准、到期撤换，都从这一码开始。</p><div class="scan-frame"><div class="qr">${qr(item)}</div></div><label class="field"><span>选择演示物料</span><select id="phone-select">${state.items.map(candidate=>`<option value="${candidate.id}" ${candidate.id===item.id?'selected':''}>${candidate.id.slice(-4)} · ${esc(candidate.name)}${candidate.status==='destroyed'?' · 已归档':''}</option>`).join('')}</select></label><button class="btn primary" data-action="scan">${icon('scan')}模拟扫码识别</button><p class="help">不会打开摄像头。二维码包含离线物料身份信息；扫码进入业务流程在本演示中模拟。</p>`}else if(phoneStep==='success'){body=`${banner}<div class="success"><div class="success-symbol">${icon('check')}</div><h2>${item.status==='destroyReview'?'销毁凭证已提交':item.status==='destroyed'?'退场完成，已归档':item.status==='review'?'摆放凭证已提交':'安装完成，已同步'}</h2><p class="help">${['review','destroyReview'].includes(item.status)?'等待总部线上审核，无需重复提交。':'状态已同步总部看板。'}<br>每次操作都有时间与物料 ID 留痕。</p></div><div class="phone-material"><h3>${esc(item.name)}</h3>${badge(item)}<p style="margin-top:10px">${esc(store?.name)}<br>${item.id}</p></div><button class="btn primary" data-action="hq" data-id="${item.id}">${icon('eye')}查看总部同步结果</button><button class="btn" data-action="phone" data-id="${item.id}">返回物料任务</button>`}else if(['install','destroy'].includes(phoneStep)){const destroy=phoneStep==='destroy';body=`${banner}<div class="phone-progress"><span class="done"></span><span class="done"></span><span class="${photo?'done':''}"></span></div><h2>${destroy?'到期撤下，完成退场':'按标准安装，拍照留痕'}</h2><p>${destroy?'先撤下物料并移除活动标识，再剪断或拆解，防止二次使用。':'请核对安装方式与建议位置，完成后提交现场照片。'}</p><div class="scene">${scene(destroy)}</div>${destroy?'<div class="instructions"><div class="instruction"><span class="number">1</span><div>从门店展示区域完整撤下到期物料。</div></div><div class="instruction"><span class="number">2</span><div>剪断 / 拆解并按当地分类要求处理，拍摄处理后照片。</div></div></div>':instructions(item)}<div class="upload">${photo?`<img src="${photo==='sample'?sceneData(destroy):photo}" alt="待提交凭证"><div>${sample?'示例照片已选用（演示）':'照片已选择'}</div>`:'请上传现场照片，或选用示例照片体验'}<label class="field"><span class="sr-only">上传凭证</span><input id="proof-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn small" data-action="samplePhoto">${icon('photo')}使用示例照片</button></div><label class="check"><input id="proof-confirm" type="checkbox">${destroy?'确认已撤下并销毁 / 拆解物料':'确认实际摆放符合安装与位置指引'}</label><button class="btn ${destroy?'danger':'primary'}" data-action="submitProof" ${!photo?'disabled':''}>${destroy?'提交销毁凭证':'提交摆放凭证'}</button><button class="btn" data-action="backPhone">返回物料信息</button>`}else{body=`${banner}<div class="eyebrow">${expired?'EXPIRY ACTION':'MATERIAL IDENTITY'}</div><h2>${expired&&item.status!=='destroyed'?'物料已到期，请撤下。':item.status==='destroyed'?'这份物料已完成退场。':'物料身份已识别'}</h2><div class="phone-material"><h3>${esc(item.name)}</h3>${badge(item)}<p style="margin-top:10px">${item.id}<br>活动：${esc(campaignOf(item)?.name)}</p><div class="phone-facts"><div><label>归属门店 / 区域</label>${esc(store?.name||item.region+'区域池')}</div><div><label>到期日期</label>${item.expires}</div></div></div>${item.status==='pending'&&!expired?`<label class="field"><span>当前扫码门店（校验门店 / 区域权限）</span><select id="receiving-store">${STORES.map(candidate=>`<option value="${candidate.id}" ${candidate.id===item.store?'selected':''}>${candidate.name}</option>`).join('')}</select></label><label class="check" style="margin-top:16px"><input type="checkbox" id="receive-confirm">已核对物料数量与外观，确认实物完好</label><button class="btn primary" data-action="receive">确认签收</button>`:item.status==='destroyed'?'<p class="help">此码不可重复签收或安装。完整记录已归档。</p>':item.status==='destroyReview'?'<div class="review-note">销毁凭证已提交，等待总部审核；通过后完成闭环。</div>':expired?`<div class="notice" style="margin:15px 0;font-size:11px">${icon('clock')}已逾期 ${-days(item)} 天，不得继续展示或安装。</div><button class="btn danger" data-action="startDestroy">${icon('trash')}确认撤下，提交销毁</button>`:item.status==='review'?'<div class="review-note">摆放凭证已提交，等待总部审核。无需重复安装。</div>':['install','issue'].includes(item.status)?`${item.issueReason?`<div class="review-note" style="color:var(--red)">${esc(item.issueReason)}</div>`:''}<button class="btn primary" data-action="startInstall">${icon('photo')}${item.status==='issue'?'整改后重新提交':'查看安装指引并提交照片'}</button>`:`<div class="review-note">安装已审核通过。${days(item)<=state.rules.advance?`还有 ${days(item)} 天到期，请提前准备撤换。`:'请保持整洁、无遮挡。'}</div><button class="btn" data-action="phoneGuide">查看安装摆放指引</button>`}<button class="btn" data-action="hq" data-id="${item.id}">查看总部记录 →</button><button class="btn text" data-action="backScan">换一份物料体验</button>`}document.getElementById('layer').innerHTML=`<div class="overlay modal-overlay" data-overlay="true"><section class="phone" role="dialog" aria-modal="true" aria-label="店长端模拟"><div class="phone-notch">9:41 · 物料云</div><div class="phone-head"><div><h3>门店物料助手</h3><p>${store?.name||'区域店长认领'} · ${state.today}</p></div><button class="close" data-action="close" aria-label="关闭店长端">×</button></div><div class="phone-body">${body}</div></section></div>`;focusDialog()}
function newMaterial(){modal('新建物料 · 一码绑定',`<form id="material-form"><div class="form-grid"><div class="field full"><label for="new-name">物料名称</label><input name="name" id="new-name" required maxlength="40" placeholder="例如：冬日暖心季 · 入口立牌"></div><div class="field"><label for="new-campaign">所属活动</label><select name="campaign" id="new-campaign">${state.campaigns.map(campaign=>`<option value="${campaign.id}">${esc(campaign.name)}</option>`).join('')}</select></div><div class="field"><label for="new-type">物料类型</label><select name="type" id="new-type">${TYPES.map(type=>`<option>${type}</option>`).join('')}</select></div><div class="field"><label for="new-binding">绑定方式</label><select name="binding" id="new-binding"><option value="store">指定门店</option><option value="region">区域池（签收绑定门店）</option></select></div><div class="field" id="binding-target"><label for="new-store">归属门店</label><select name="store" id="new-store">${STORES.map(store=>`<option value="${store.id}">${store.name}</option>`).join('')}</select></div><div class="field full"><label for="new-expiry">到期日期</label><input name="expires" type="date" id="new-expiry" value="${state.campaigns[0].end}" required></div></div><p class="help">创建唯一物料 ID，初始状态为待签收。正式二维码 / 标签打印服务待接入，本演示可直接模拟扫码体验新物料。</p><div class="drawer-actions"><button class="btn primary" type="submit">创建物料</button><button class="btn" type="button" data-action="close">取消</button></div></form>`)}
function newCampaign(){modal('创建活动',`<form id="campaign-form"><div class="form-grid"><div class="field full"><label for="campaign-name">活动名称</label><input name="name" id="campaign-name" required maxlength="20" placeholder="例如：新年焕新季"></div><div class="field full"><label for="campaign-theme">活动主题</label><input name="theme" id="campaign-theme" required maxlength="45" placeholder="一句话说明活动目标"></div><div class="field"><label for="campaign-start">开始日期</label><input name="start" id="campaign-start" type="date" value="${state.today}" required></div><div class="field"><label for="campaign-end">结束日期</label><input name="end" id="campaign-end" type="date" value="2026-12-31" required></div></div><div class="drawer-actions"><button class="btn primary" type="submit">创建活动</button><button class="btn" type="button" data-action="close">取消</button></div></form>`)}
const GUIDE=[{title:'一码，让物料身份清清楚楚',text:'物料台账中，每份物料绑定独立 ID、活动、门店或区域与有效期。详情可查看二维码和完整操作记录。',destination:'materials',label:'查看物料台账',takeaway:'老板关注点：知道“什么物料，在谁的门店，还能用多久”。'},{title:'物料到了，店长扫码签收',text:'模拟扫码，校验门店并确认实物完好。区域池物料可由同区域店长认领，绑定实际门店。',destination:'phone',label:'演示扫码签收',takeaway:'老板关注点：责任落到店长，不再只知道发货、不知道是否到店。'},{title:'安装有标准，现场看得见',text:'店长查看安装方式、建议位置和摆放示例，上传照片。总部线上审核，确认后才进入健康在用状态。',destination:'review',label:'查看待审核凭证',takeaway:'老板关注点：从“发过培训资料”升级为“看到门店按标准执行”。'},{title:'到期不是通知结束，而是流程开始',text:'提醒中心提前生成任务，推进日期可验证变化。店长确认撤下、提交销毁凭证，总部审核后归档。',destination:'reminders',label:'演示到期闭环',takeaway:'老板关注点：活动结束后不继续展示；退场有照片、有责任人、有记录。'},{title:'总部从看数字，到管问题',text:'健康率随签收、摆放审核与销毁操作变化。通过门店监督集中跟进逾期、整改和未审核项。',destination:'stores',label:'查看门店监督',takeaway:'落地建议：先以一个区域试点，再接入真实扫码、企微提醒与云端照片。'}];
function guide(step=0){const entry=GUIDE[step];modal('老板演示路线 · 约 3 分钟',`<div class="guide-nav">${GUIDE.map((value,index)=>`<button data-action="guideStep" data-step="${index}" class="${step===index?'active':''}" aria-label="第 ${index+1} 步">${index+1}</button>`).join('')}</div><div class="guide-card"><div class="eyebrow">STEP ${String(step+1).padStart(2,'0')} / 05</div><h3>${entry.title}</h3><p>${entry.text}</p></div><div class="takeaway">${entry.takeaway}</div><div class="drawer-actions"><button class="btn primary" data-action="guideGo" data-destination="${entry.destination}">${entry.label} →</button><button class="btn" data-action="guideStep" data-step="${(step+1)%5}">${step===4?'回到第一步':'下一步'}</button></div><p class="help">示例业务数据。所有操作只在本地演示，不触发外部消息。</p>`)}
function sendReminder(item){if(item.status==='destroyed'||state.sent.some(entry=>entry.id===item.id&&entry.date===state.today))return false;state.sent.push({id:item.id,date:state.today,channel:state.rules.channel});log(item,`模拟${days(item)<=state.rules.advance?'到期提醒':'流程催办'} · ${state.rules.channel}${days(item)<0&&-days(item)>=state.rules.overdue?' · 同步区域负责人':''}`);persist();return true}
function exportCSV(){const rows=[['物料ID','物料名称','活动','绑定类型','区域','门店','店长','到期日期','流程状态','健康分类'],...filtered().map(item=>[item.id,item.name,campaignOf(item)?.name,item.binding,item.region,storeOf(item)?.name||'区域待分配',storeOf(item)?.manager||'区域负责人',item.expires,STATUS[item.status],{healthy:'健康在用',expiring:'临期',expired:'逾期',issue:'整改',pending:'待处理',closed:'已归档'}[health(item)]])];const csv='\ufeff'+rows.map(row=>row.map(value=>'"'+String(value??'').replace(/^([=+@-])/,'\t$1').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download=`物料台账_${state.today}.csv`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选结果，可用 Excel 打开')}
function filtered(){return state.items.filter(item=>(!search||`${item.name} ${item.id} ${storeOf(item)?.name||''}`.toLowerCase().includes(search.toLowerCase()))&&(statusFilter==='all'||(statusFilter==='review'?['review','destroyReview'].includes(item.status):statusFilter==='unreceived'?item.status==='pending':health(item)===statusFilter))&&(regionFilter==='all'||item.region===regionFilter)&&(campaignFilter==='all'||item.campaign===campaignFilter))}
function materials(){return`${heading('ONE CODE / ONE MATERIAL','物料台账','一份物料，一个身份。全生命周期状态与操作留痕。','<button class="btn" data-action="export">'+icon('download')+'导出台账</button><button class="btn primary" data-action="newMaterial">'+icon('plus')+'新建物料</button>')}<div class="filters"><label class="search"><span class="sr-only">搜索物料或门店</span>${icon('search')}<input id="search" placeholder="搜索物料名称、ID 或门店" value="${esc(search)}"></label><select id="status-filter" aria-label="物料状态">${[['all','全部状态'],['healthy','健康在用'],['expiring','即将到期'],['expired','已到期'],['issue','需整改'],['unreceived','待签收'],['review','待总部审核'],['closed','已销毁']].map(([value,label])=>`<option value="${value}" ${value===statusFilter?'selected':''}>${label}</option>`).join('')}</select><select id="region-filter" aria-label="归属区域"><option value="all">全部区域</option>${[...new Set(STORES.map(store=>store.region))].map(region=>`<option ${region===regionFilter?'selected':''}>${region}</option>`).join('')}</select><select id="campaign-filter" aria-label="所属活动"><option value="all">全部活动</option>${state.campaigns.map(campaign=>`<option value="${campaign.id}" ${campaign.id===campaignFilter?'selected':''}>${esc(campaign.name)}</option>`).join('')}</select></div><section class="panel"><div id="material-table">${table(filtered())}</div><div class="caption"><span id="count-label">共 ${filtered().length} 份物料</span><span>详情中查看一码绑定、摆放标准与操作记录</span></div></section>`}
function campaigns(){return`${heading('CAMPAIGN / LIFECYCLE','活动管理','活动标准统一下发，物料有效期一处管理。','<button class="btn primary" data-action="newCampaign">'+icon('plus')+'创建活动</button>')}<div class="cards">${state.campaigns.map(campaign=>{const items=state.items.filter(item=>item.campaign===campaign.id),installed=items.filter(item=>['active','destroyed'].includes(item.status)).length;return`<article class="panel"><div class="activity-art ${campaign.color}"><small>${esc(campaign.season)}</small><strong>${esc(campaign.name)}</strong>${poster()}</div><div class="activity-body"><div class="store-top"><h3>${esc(campaign.headline)}</h3><span class="badge ${campaign.end<state.today?'gray':''}">${campaign.end<state.today?'已结束':campaign.start>state.today?'未开始':'进行中'}</span></div><p>${campaign.start} — ${campaign.end}</p><div class="progress-label"><span>安装通过 / 已归档</span><strong>${installed} / ${items.length}</strong></div><div class="track"><span style="width:${items.length?installed/items.length*100:0}%"></span></div><div class="store-top" style="margin-top:20px"><span class="muted" style="font-size:11px">覆盖 ${new Set(items.map(item=>item.store).filter(Boolean)).size} 家门店</span><button class="btn text" data-action="campaignItems" data-id="${campaign.id}">查看活动物料 →</button></div></div></article>`}).join('')}</div><div class="review-note">新建物料默认继承活动有效期，也可指定独立到期日期。到期判定优先于签收状态：未签收的过期物料也需退场。</div>`}
function stores(){return`${heading('HQ SUPERVISION / STORE HEALTH','门店监督','总部线上看现场，异常处理有责任人、凭证与时间记录。')}<div class="store-grid">${STORES.map(store=>{const items=state.items.filter(item=>item.store===store.id&&item.status!=='destroyed'),healthy=items.filter(item=>health(item)==='healthy').length,abnormal=items.filter(item=>['expired','issue'].includes(health(item))).length;return`<article class="panel store-card"><div class="store-top"><div><h3>${store.name}</h3><p>${store.area} / ${store.region}</p></div><span class="badge ${abnormal?'orange':''}">${abnormal?'需关注':'正常跟进'}</span></div><div class="store-stats"><div><strong>${items.length?Math.round(healthy/items.length*100):100}%</strong><small>物料健康率</small></div><div><strong>${items.length}</strong><small>未归档物料</small></div><div><strong style="color:${abnormal?'var(--red)':'var(--ink)'}">${abnormal}</strong><small>到期 / 整改</small></div></div><div class="store-top"><span class="muted" style="font-size:11px">店长 ${store.manager} · ${store.id}</span><button class="btn text" data-action="storeDetail" data-id="${store.id}">查看现场凭证 →</button></div></article>`}).join('')}</div>`}
function reminders(){const items=state.items.filter(item=>item.status!=='destroyed'&&days(item)<=state.rules.advance);return`${heading('EXPIRY / CLOSED LOOP','提醒中心','提前提醒，按时退场。每一次提醒都指向可执行的门店任务。','<button class="btn" data-action="advance">'+icon('clock')+'模拟推进 1 天</button><button class="btn primary" data-action="sendAll">'+icon('bell')+'模拟发送提醒</button>')}<div class="notice">${icon('info')}<div>演示业务日 <strong>${state.today}</strong> · 到期前 ${state.rules.advance} 天生成任务，逾期 ${state.rules.overdue} 天升级区域负责人。推进日期可看到状态自动变化；不连接真实定时任务或企微。</div></div><section class="panel"><div class="panel-head"><div><h2>到期跟进任务</h2><p>临期与逾期未归档物料 · 共 ${items.length} 份</p></div><span class="badge orange">${state.rules.channel}</span></div><div class="table-wrap"><table><thead><tr><th>物料 / 责任门店</th><th>提醒状态</th><th>责任人</th><th>最近发送</th><th>执行</th></tr></thead><tbody>${items.length?items.sort((first,second)=>days(first)-days(second)).map(item=>{const sent=state.sent.filter(entry=>entry.id===item.id).at(-1);return`<tr><td><div class="cell-title">${esc(item.name)}</div><div class="cell-sub">${esc(storeOf(item)?.name||item.region+'区域池')} · ${item.id}</div></td><td><span class="badge ${days(item)<0?'red':'orange'}">${days(item)<0?`逾期 ${-days(item)} 天${-days(item)>=state.rules.overdue?' · 已升级':''}`:days(item)===0?'今天到期':`提前 ${days(item)} 天提醒`}</span></td><td>${esc(storeOf(item)?.manager||'区域负责人')}<div class="cell-sub">${item.region}${days(item)<0&&-days(item)>=state.rules.overdue?'负责人同步接收':''}</div></td><td>${sent?sent.date+'<div class="cell-sub">模拟发送 · '+sent.channel+'</div>':'<span class="muted">尚未模拟发送</span>'}</td><td><button class="link" data-action="phone" data-id="${item.id}">店长处理 →</button><button class="link" data-action="remind" data-id="${item.id}">催办</button></td></tr>`}).join(''):'<tr><td colspan="5" class="empty">暂无临期或逾期物料</td></tr>'}</tbody></table></div><div class="caption"><span>任务按日期计算；发送记录按“物料 + 业务日”去重</span><span>${state.sent.length} 条模拟记录</span></div></section>`}
function settings(){return`${heading('GOVERNANCE / STANDARD','规则设置','让标准变成流程，而不只是通知。')}<div class="rule-grid"><section class="panel rule"><h3>到期与审核规则</h3><p>保存后立即影响健康判定、待办与提醒中心。</p><form id="rules-form"><div class="fields"><div class="field"><label for="advance-days">提前提醒天数</label><select name="advance" id="advance-days">${[1,3,5,7].map(value=>`<option value="${value}" ${value===state.rules.advance?'selected':''}>到期前 ${value} 天</option>`).join('')}</select></div><div class="field"><label for="overdue-days">升级区域负责人</label><select name="overdue" id="overdue-days">${[1,2,3].map(value=>`<option value="${value}" ${value===state.rules.overdue?'selected':''}>逾期 ${value} 天</option>`).join('')}</select></div><div class="field"><label for="channel">提醒渠道（模拟）</label><select name="channel" id="channel">${['企微 + 站内通知','站内通知','短信 + 站内通知'].map(value=>`<option ${value===state.rules.channel?'selected':''}>${value}</option>`).join('')}</select></div><label class="check"><input type="checkbox" name="review" ${state.rules.review?'checked':''}>摆放与销毁需总部审核（关闭后，提交凭证即通过）</label><button class="btn primary" type="submit">保存规则</button></div></form></section><section class="panel rule"><h3>一码绑定与数据边界</h3><p>物料身份、活动信息与门店职责保持一致。</p>${[['物料身份唯一','每份实物一个物料 ID 与二维码，不重复签收。'],['绑定门店或区域','门店码限制指定门店；区域池仅允许同区域店长认领。'],['到期后不得继续安装','即使尚未签收，到期物料也转入撤换与销毁闭环。'],['总部审核留痕','保留摆放与销毁凭证。整改后重新提交，审核通过才进入下一状态。']].map(([title,text],index)=>`<div class="rule-step"><span class="number">${index+1}</span><div><strong>${title}</strong><p>${text}</p></div></div>`).join('')}<button class="btn" data-action="reset" style="margin-top:25px">${icon('refresh')}重置演示数据</button><p class="help">清除本地演示操作，恢复初始场景。</p></section></div>`}
function focusDialog(){requestAnimationFrame(()=>document.querySelector('#layer button,#layer input,#layer select')?.focus())}
function close(){document.getElementById('layer').innerHTML='';phoneId='';photo='';render()}
function modal(title,body){document.getElementById('layer').innerHTML=`<div class="overlay modal-overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body">${body}</div></section></div>`;focusDialog()}
function instructions(item){const steps=item.type==='收银台桌卡'?['沿折线折成立式桌卡，插口卡紧，保持图文正面完整。','摆在收银台顾客侧，朝向排队顾客；不遮挡支付码或价签。','上传桌卡正面与收银台周边同框照片，便于总部核对。']:item.type==='橱窗海报'?['清洁玻璃后，用可移除双面胶固定四角，保持平整。','放在橱窗顾客视线区域，不遮挡营业时间与安全标识。','上传橱窗全景照片，需看清活动文字与展示位置。']:['展开底座，将支撑杆卡入背板固定槽，检查立牌稳定性。','摆在入口右侧，朝向客流；不得遮挡入口与消防通道。','上传立牌正面与门店入口同框照片，活动文字需清晰。'];return`<div class="instructions">${steps.map((text,index)=>`<div class="instruction"><span class="number">${index+1}</span><div>${text}</div></div>`).join('')}</div><p class="help">图示为入口立牌通用示意；${item.type}以对应文字指引为准。正式版按物料配置独立图示 / 视频。</p>`}
function detail(id,tab='guide'){const item=itemOf(id);if(!item)return;let content='';if(tab==='guide')content=`<h3 style="margin-bottom:15px">安装与建议摆放位置</h3><div class="scene"><div class="scene-label">摆放示意 · 非实景照片</div>${scene()}</div>${instructions(item)}<div class="review-note">到期处理：撤下物料，移除活动标识并剪断 / 拆解，上传销毁凭证，${state.rules.review?'总部审核后':'提交后'}归档。</div>`;if(tab==='proof')content=`<h3 style="margin-bottom:15px">摆放凭证</h3>${item.proof?`<img class="evidence" src="${item.proof==='sample'?sceneData(false):item.proof}" alt="摆放凭证"><p class="help">${item.proofIsSample?'示例凭证 · 非真实门店照片':'店长上传照片 · 演示人工审核，不含 AI 识别'}</p>`:'<div class="empty">尚未提交摆放凭证</div>'}${item.issueReason?`<div class="notice" style="margin-top:15px">${esc(item.issueReason)}</div>`:''}${item.destroyProof?`<h3 style="margin:22px 0 15px">销毁凭证</h3><img class="evidence" src="${item.destroyProof==='sample'?sceneData(true):item.destroyProof}" alt="销毁凭证"><p class="help">${item.destroyIsSample?'示例销毁照片 · 非真实凭证':'店长上传销毁照片'} · ${item.status==='destroyed'?'已审核归档':'待总部审核'}</p>`:''}`;if(tab==='history')content=[...item.events].reverse().map(entry=>`<div class="timeline-item"><span class="timeline-dot"></span><div>${esc(entry.text)}<p>${esc(entry.time)}</p></div></div>`).join('');if(tab==='qr')content=`<div class="qr-box"><div class="qr">${qr(item)}</div><div><h3>专属物料码</h3><p>${item.id}<br>活动：${esc(campaignOf(item)?.name)}<br>门店 / 区域：${esc(storeOf(item)?.name||item.region)}<br>到期：${item.expires}</p></div></div><p class="help">初始物料二维码可读取离线身份信息，不跳转线上系统；新建物料的正式二维码待接入。点击“店长处理”可模拟完整流程。</p>`;document.getElementById('layer').innerHTML=`<div class="overlay" data-overlay="true"><section class="drawer" role="dialog" aria-modal="true" aria-label="物料详情"><div class="drawer-head"><div><h2>物料详情</h2><p>一码一物 · 全生命周期追溯</p></div><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="drawer-body"><div class="detail-banner"><div class="preview">${poster()}</div><div><h3>${esc(item.name)}</h3><p class="mono">${item.id}</p><p>${esc(campaignOf(item)?.name)}</p>${badge(item)}</div></div><h3 style="margin-bottom:16px">绑定信息</h3><div class="facts">${[['绑定类型',item.binding==='region'?'区域池 → 签收分配':'指定门店'],['所属区域',item.region],['归属门店',storeOf(item)?.name||'等待区域店长认领'],['责任店长',storeOf(item)?.manager||'区域负责人'],['物料类型',item.type],['到期日期',item.expires]].map(([label,value])=>`<div class="fact"><label>${label}</label><span>${esc(value)}</span></div>`).join('')}</div><div class="tabs" role="tablist" aria-label="详情内容">${[['guide','安装摆放'],['proof','现场凭证'],['history','操作记录'],['qr','专属二维码']].map(([key,label])=>`<button data-action="detailTab" data-id="${id}" data-tab="${key}" role="tab" aria-selected="${key===tab}" class="${key===tab?'active':''}">${label}</button>`).join('')}</div><div role="tabpanel">${content}</div><div class="drawer-actions">${item.status==='review'?`<button class="btn primary" data-action="approve" data-id="${id}">${icon('check')}摆放审核通过</button><button class="btn" data-action="reject" data-id="${id}">退回整改</button>`:item.status==='destroyReview'?`<button class="btn danger" data-action="approveDestroy" data-id="${id}">销毁审核通过</button><button class="btn" data-action="rejectDestroy" data-id="${id}">退回补充凭证</button>`:item.status!=='destroyed'?`<button class="btn primary" data-action="phone" data-id="${id}">${icon('mobile')}店长处理</button><button class="btn" data-action="remind" data-id="${id}">模拟催办</button>${item.status==='active'&&days(item)>=0?`<button class="btn" data-action="reject" data-id="${id}">发起整改</button>`:''}`:''}</div></div></section></div>`;focusDialog()}
function table(items){return`<div class="table-wrap"><table><thead><tr><th>物料 / 物料 ID</th><th>归属门店</th><th>到期日期</th><th>当前状态</th><th>操作</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td><div class="material"><span class="thumb">${poster()}</span><div><div class="cell-title">${esc(item.name)}</div><div class="cell-sub mono">${item.id}</div></div></div></td><td><div class="cell-title">${esc(storeOf(item)?.name||'区域待分配')}</div><div class="cell-sub">${esc(item.region)} ${item.binding==='region'?'· 区域池分配':''}</div></td><td>${item.expires}<div class="cell-sub" style="color:${days(item)<0&&item.status!=='destroyed'?'var(--red)':'var(--muted)'}">${item.status==='destroyed'?'已完成归档':days(item)<0?`已逾期 ${-days(item)} 天`:days(item)===0?'今天到期':`剩余 ${days(item)} 天`}</div></td><td>${badge(item)}</td><td><button class="link" data-action="detail" data-id="${item.id}">查看详情 →</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无符合条件的物料</td></tr>'}</tbody></table></div>`}
